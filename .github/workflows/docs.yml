name: Publish MkDocs
on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/index.md
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: lab1
          path: sources/lab1
      - uses: actions/checkout@v4
        with:
          ref: lab2
          path: sources/lab2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both lab reports
        run: |
          lab1=sources/lab1/students/к3340/Afanasyev_Dmitry/laboratory_work_1
          lab2=sources/lab2/students/к3340/Afanasyev_Dmitry/laboratory_work_2
          pip install -r "$lab1/requirements-docs.txt"
          cp -R "$lab1/docs/lr1" docs/lr1
          cp -R "$lab2/docs" docs/lr2
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4